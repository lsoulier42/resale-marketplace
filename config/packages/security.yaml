security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            entry_point: App\Security\ApiAwareAuthenticationEntryPoint
            user_checker: App\Security\VerifiedUserChecker
            json_login:
                login_path: /api/login
                check_path: /api/login
                username_path: email
                password_path: password
                failure_handler: App\Security\JsonLoginFailureHandler
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    # La sécurité de l'API est portée par les attributs #[IsGranted] des
    # contrôleurs Api/* (les autres chemins sont servis par la SPA React).
    access_control: []

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
