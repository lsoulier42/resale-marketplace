services:
  database:
    image: postgres:18.2-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-app} -d ${DATABASE_NAME:-resale_marketplace}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - "./docker/db/postgresql:/var/lib/postgresql/data"
    ports:
      - "${DATABASE_HOST_PORT:-5532}:${DATABASE_PORT:-5432}"
    environment:
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:-app}"
      POSTGRES_USER: "${DATABASE_USER:-app}"
      POSTGRES_DB: "${DATABASE_NAME:-resale_marketplace}"

  php:
    build:
      context: ./docker/php
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000'"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - ".:/var/www/html"
      - "~/.composer:/home/docker/.composer"
      - "~/.ssh:/home/docker/.ssh"
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.29.5-alpine
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - ".:/var/www/html"
      - "./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf"
    depends_on:
      php:
        condition: service_healthy

  mailer:
    image: axllent/mailpit
    ports:
      - "${MAILER_SMTP_PORT:-1126}:1025"
      - "${MAILER_HTTP_PORT:-1181}:8025"
